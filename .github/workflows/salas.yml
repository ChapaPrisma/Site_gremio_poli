# Atualiza assets/dados/salas.json com as salas e ocupações do USPolis.
# É só um agendador: todo o trabalho está em ferramentas/salas.mjs, que roda igual
# em qualquer servidor com Node (ver README, seção "Salas da Poli").
#
# Cache de 1 hora, vital para não sobrecarregar o USPolis: roda no máximo uma vez por hora, e só
# no período em que a Poli está aberta. O script ainda tem a própria trava (uma consulta por hora,
# no máximo), guardada entre as execuções pelo actions/cache, então nem uma execução manual
# fora de hora chama o USPolis antes do tempo.
name: Salas da Poli

on:
  schedule:
    # De hora em hora, das 6h às 23h de São Paulo (9h às 2h em UTC).
    - cron: "15 0-2,9-23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dados-do-site
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # a hora da última consulta ao USPolis passa de uma execução para a outra
      - uses: actions/cache@v4
        with:
          path: ferramentas/.cache
          key: salas-trava-${{ github.run_id }}
          restore-keys: salas-trava-
      - run: node ferramentas/salas.mjs
      - name: Publicar se mudou
        run: |
          if git diff --quiet -- assets/dados/salas.json; then
            echo "Sem mudanças nas salas."
            exit 0
          fi
          git config user.name "salas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dados/salas.json
          git commit -m "Atualiza salas da Poli (USPolis)"
          git pull --rebase origin main
          git push
